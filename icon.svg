<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#3b82f6" rx="64"/>

  <!-- Checkmark circle -->
  <circle cx="256" cy="200" r="80" fill="white" opacity="0.3"/>

  <!-- Main checklist icon -->
  <g transform="translate(160, 120)">
    <!-- Checkmark 1 -->
    <circle cx="20" cy="20" r="16" fill="white"/>
    <path d="M 14 20 L 18 24 L 26 14" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Line 1 -->
    <rect x="50" y="12" width="120" height="16" rx="8" fill="white"/>

    <!-- Checkmark 2 -->
    <circle cx="20" cy="80" r="16" fill="white"/>
    <path d="M 14 80 L 18 84 L 26 74" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Line 2 -->
    <rect x="50" y="72" width="120" height="16" rx="8" fill="white"/>

    <!-- Checkmark 3 (unchecked) -->
    <circle cx="20" cy="140" r="16" fill="white" opacity="0.5"/>

    <!-- Line 3 -->
    <rect x="50" y="132" width="120" height="16" rx="8" fill="white" opacity="0.5"/>
  </g>

  <!-- Bottom accent -->
  <rect x="128" y="380" width="256" height="8" rx="4" fill="white" opacity="0.3"/>
</svg>
