<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #2563eb;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        .icons {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .icon-container {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Generate App Icons</h1>
    <p>Click the buttons below to generate and download the app icons:</p>

    <button onclick="generateIcon(192)">Generate 192x192 Icon</button>
    <button onclick="generateIcon(512)">Generate 512x512 Icon</button>

    <div class="icons" id="icons"></div>

    <script>
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background with rounded corners
            const cornerRadius = size / 8;
            ctx.fillStyle = '#3b82f6';
            roundRect(ctx, 0, 0, size, size, cornerRadius);
            ctx.fill();

            // Scale factor
            const scale = size / 512;

            // Checkmark circle (decorative)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(size / 2, size * 0.39, 80 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Main checklist
            const baseX = size * 0.3125;
            const baseY = size * 0.234;

            // Checkmark 1
            drawCheckbox(ctx, baseX, baseY, scale, true);
            drawLine(ctx, baseX + 50 * scale, baseY + 12 * scale, 120 * scale, scale);

            // Checkmark 2
            drawCheckbox(ctx, baseX, baseY + 60 * scale, scale, true);
            drawLine(ctx, baseX + 50 * scale, baseY + 72 * scale, 120 * scale, scale);

            // Checkmark 3 (unchecked)
            drawCheckbox(ctx, baseX, baseY + 120 * scale, scale, false);
            drawLine(ctx, baseX + 50 * scale, baseY + 132 * scale, 120 * scale, scale, 0.5);

            // Bottom accent
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            roundRect(ctx, size * 0.25, size * 0.742, size * 0.5, 8 * scale, 4 * scale);
            ctx.fill();

            // Display and download
            const container = document.createElement('div');
            container.className = 'icon-container';
            container.innerHTML = `<p>${size}x${size}</p>`;
            container.appendChild(canvas);

            const downloadBtn = document.createElement('button');
            downloadBtn.textContent = `Download ${size}x${size}`;
            downloadBtn.onclick = () => {
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            };
            container.appendChild(downloadBtn);

            document.getElementById('icons').appendChild(container);
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawCheckbox(ctx, x, y, scale, checked) {
            const opacity = checked ? 1 : 0.5;

            // Circle
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            ctx.beginPath();
            ctx.arc(x + 20 * scale, y + 20 * scale, 16 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Checkmark
            if (checked) {
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 3 * scale;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(x + 14 * scale, y + 20 * scale);
                ctx.lineTo(x + 18 * scale, y + 24 * scale);
                ctx.lineTo(x + 26 * scale, y + 14 * scale);
                ctx.stroke();
            }
        }

        function drawLine(ctx, x, y, width, scale, opacity = 1) {
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            roundRect(ctx, x, y, width, 16 * scale, 8 * scale);
            ctx.fill();
        }
    </script>
</body>
</html>
